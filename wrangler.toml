name = "hedge-music-alpha"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# This is a Cloudflare PAGES project (functions/ = Pages Functions).
# Deploy with `wrangler pages deploy .` or Pages Git integration.
# Do NOT use `wrangler deploy` (that is Workers, which ignores functions/).

[[d1_databases]]
binding = "DB"
database_name = "hedge-music-alpha-db"
database_id = "4b3819b9-62bd-45c7-9b88-3a2c52c85372"

[[r2_buckets]]
binding = "R2"
bucket_name = "hedge-music-tracks"

[[kv_namespaces]]
binding = "SESSIONS"
id = "f5e4f69f28474d899ca4c2084c1fea9f"
preview_id = "f5e4f69f28474d899ca4c2084c1fea9f"

[vars]
ENV = "production"
GH_REPO = "lash122/hedge-music-alpha"
# GH_PAT is a SECRET — add it via Dashboard (Variables and secrets), NOT here (it would be public in the repo)
